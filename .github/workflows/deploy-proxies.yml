name: Deploy Proxies

on:
  push:
    branches: [main]
    paths:
      - "edge/**"
      - "deploy/**"
      - "configs/litellm_config_free.yaml"
      - "configs/free_models_ids.txt"
      - "configs/chat_proxy.json"
      - "src/**"
      - ".github/workflows/deploy-proxies.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Deploy Cloudflare Worker
        id: deploy_worker
        working-directory: edge
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PROXY_GUEST_TOKEN: ${{ secrets.PROXY_GUEST_TOKEN }}
          WORKER_URL_SECRET: ${{ secrets.WORKER_URL }}
        run: |
          set -o pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID not set — skipping Worker deploy."
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHAIN=$(head -n 1 ../configs/free_models_ids.txt | paste -sd, -)
          ALLOWED=$(head -n 20 ../configs/free_models_ids.txt | paste -sd, -)
          npm install
          DEPLOY_LOG="$(mktemp)"
          if ! npx wrangler deploy --var "MODEL_CHAIN:${CHAIN}" --var "ALLOWED_MODELS:${ALLOWED}" 2>&1 | tee "$DEPLOY_LOG"; then
            echo "Wrangler deploy failed."
            if [ -n "$WORKER_URL_SECRET" ]; then
              echo "Using WORKER_URL secret; skipping chat_proxy.json update."
              echo "deployed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            exit 1
          fi
          WORKER_URL="$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' "$DEPLOY_LOG" | tail -1)"
          if [ -z "$WORKER_URL" ]; then
            WORKER_URL="$WORKER_URL_SECRET"
          fi
          if [ -z "$WORKER_URL" ]; then
            echo "Could not detect Worker URL from deploy output."
            exit 1
          fi
          echo "worker_url=$WORKER_URL" >> "$GITHUB_OUTPUT"
          echo "deployed=true" >> "$GITHUB_OUTPUT"
          if [ -n "$OPENROUTER_API_KEY" ]; then
            echo "$OPENROUTER_API_KEY" | npx wrangler secret put OPENROUTER_API_KEY
          fi
          if [ -n "$GROQ_API_KEY" ]; then
            echo "$GROQ_API_KEY" | npx wrangler secret put GROQ_API_KEY
          fi
          if [ -n "$PROXY_GUEST_TOKEN" ]; then
            echo "$PROXY_GUEST_TOKEN" | npx wrangler secret put PROXY_GUEST_TOKEN
          fi

      - name: Update chat_proxy.json
        if: steps.deploy_worker.outputs.deployed == 'true'
        env:
          LITELLM_URL: ${{ secrets.LITELLM_URL }}
        run: |
          python3 <<PY
          import json
          from pathlib import Path
          import os
          worker_url = "${{ steps.deploy_worker.outputs.worker_url }}"
          litellm_url = os.environ.get("LITELLM_URL", "").strip()
          path = Path("configs/chat_proxy.json")
          data = json.loads(path.read_text(encoding="utf-8")) if path.is_file() else {}
          existing = data.get("endpoints") or []
          secondary = [
              u.rstrip("/")
              for u in existing
              if u.rstrip("/") != worker_url.rstrip("/")
          ]
          endpoints = [worker_url.rstrip("/")] + secondary
          if litellm_url and litellm_url.rstrip("/") not in endpoints:
              endpoints.append(litellm_url.rstrip("/"))
          data["endpoints"] = list(dict.fromkeys(endpoints))
          data["guestToken"] = data.get("guestToken") or "llm-fallbacks-public"
          data["description"] = "Zero-config demo proxy for GitHub Pages chat."
          path.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
          print("Updated chat_proxy.json with", worker_url)
          PY

      - name: Commit chat_proxy.json
        if: steps.deploy_worker.outputs.deployed == 'true'
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add configs/chat_proxy.json
          git diff --staged --quiet || (
            git commit -m "chore: update chat_proxy.json from Worker deploy" &&
            git push
          )

  trigger-render:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render redeploy
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK" ]; then
            curl -fsS -X POST "$RENDER_DEPLOY_HOOK"
            echo "Triggered Render via deploy hook."
            exit 0
          fi
          if [ -n "$RENDER_API_KEY" ] && [ -n "$RENDER_SERVICE_ID" ]; then
            curl -fsS -X POST "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
              -H "Authorization: Bearer ${RENDER_API_KEY}" \
              -H "Content-Type: application/json" \
              -d '{}'
            echo "Triggered Render via API (service ${RENDER_SERVICE_ID})."
            exit 0
          fi
          echo "RENDER_DEPLOY_HOOK and RENDER_API_KEY/RENDER_SERVICE_ID not set — skipping Render redeploy."

  generate-provider-urls:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          pip install -e .
          pip install pyyaml

      - name: Regenerate provider_urls.json if changed
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python -m llm_fallbacks.generate_configs --output-dir configs
          git diff --quiet configs/provider_urls.json || (
            git config user.email "action@github.com" &&
            git config user.name "GitHub Action" &&
            git add configs/provider_urls.json &&
            git commit -m "chore: update provider_urls.json" &&
            git push
          )
